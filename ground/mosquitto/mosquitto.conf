# AURORA broker (docs/interfaces.md Section 1).
# Anonymous access is allowed because the broker runs on the dedicated demo LAN only
# (laptop + board on our own router/hotspot). Never expose these ports to a shared network.

# MQTT for the core, twin, attack scripts and the hardware bridge
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets for the Open MCT dashboard
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# No persistence: a broker restart (make reset) starts clean, retained states included.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
